# spl-mcp secrets -- library credentials.
#
# Copy to ~/.config/spl-mcp/secrets.toml and chmod 600 it.
# NEVER commit the real file. It is listed in .gitignore.
#
# Alternatively set these as environment variables, which take precedence:
#   SPL_MCP_CARD_NUMBER
#   SPL_MCP_PIN

[credentials]
# Your library card number (the "name" field on the BiblioCommons login form).
card_number = "0000000000000"

# Your library PIN.
pin = "0000"

[project]
name = "spl-mcp"
version = "0.1.0"
description = "MCP server for searching the Seattle Public Library catalog and managing holds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "John Davidson" }]
keywords = ["mcp", "library", "bibliocommons", "seattle-public-library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Every dependency is capped below its next major version. mcp 2.0 (2026-07-28)
# removed mcp.server.fastmcp, and an uncapped "mcp>=1.2" broke every fresh
# install of this server; tests/test_server.py now imports the server to catch it.
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
spl-mcp = "spl_mcp.server:main"
spl-mcp-health = "spl_mcp.health:main"

[project.urls]
Homepage = "https://github.com/johnmmdavidson/spl-mcp"
Issues = "https://github.com/johnmmdavidson/spl-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
